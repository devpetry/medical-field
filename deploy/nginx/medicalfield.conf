# MedicalField - API Gateway e portal (/etc/nginx/sites-enabled/medicalfield)
# Só o Nginx fica exposto; os serviços escutam em 127.0.0.1.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 2m;
    server_tokens off;

    # O navegador não "adivinha" tipos de arquivo, o portal não abre dentro de
    # frames de outros sites e links externos não recebem a página de origem.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Portal administrativo (build do Vite) e Swagger em /docs/
    root /var/www/medicalfield;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeçalhos repassados aos serviços. X-Forwarded-For é sobrescrito (não
    # concatenado) para o cliente não conseguir forjar o IP gravado no log.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Device-Id $http_x_device_id;
    proxy_read_timeout 60s;

    # auth-service (Node.js)
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3001/auth/;
    }
    location = /api/profissional {
        proxy_pass http://127.0.0.1:3001/profissional;
    }

    # document-service (Python)
    location /api/documento/ {
        proxy_pass http://127.0.0.1:8000/documento/;
    }

    # clinical-service (Java): demais rotas
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
    }
}
