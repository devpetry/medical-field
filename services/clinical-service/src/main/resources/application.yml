server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  forward-headers-strategy: none

spring:
  application:
    name: clinical-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/medicalfield}
    username: ${DB_USER:mf_clinical}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: clinical
        jdbc.time_zone: UTC
  flyway:
    schemas: clinical,audit
    default-schema: clinical
    create-schemas: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

medicalfield:
  jwt-secret: ${JWT_SECRET:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{20} - %msg%n"
