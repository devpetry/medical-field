# Gera os executáveis do cliente: AppImage + script de abertura (Linux) e .exe portátil (Windows).
# Ficam como artefatos da execução; numa tag v* (ex.: v1.0.0) também vão para a página Releases.
name: Executáveis do cliente

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'client/**'
      - '.github/workflows/cliente.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Dependências
        run: npm ci --no-audit --no-fund

      - name: Versão da tag (v1.2.3 → 1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Gerar o AppImage
        run: npm run appimage && cp scripts/abrir-medicalfield.sh release/

      - uses: actions/upload-artifact@v4
        with:
          name: MedicalField-linux
          path: |
            client/release/*.AppImage
            client/release/abrir-medicalfield.sh
          if-no-files-found: error

      - name: Publicar na página Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/release/*.AppImage
            client/release/abrir-medicalfield.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Dependências
        run: npm ci --no-audit --no-fund

      - name: Versão da tag (v1.2.3 → 1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Gerar o .exe portátil
        run: npm run exe

      - uses: actions/upload-artifact@v4
        with:
          name: MedicalField-windows
          path: client/release/*.exe
          if-no-files-found: error

      - name: Publicar na página Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/release/*.exe
