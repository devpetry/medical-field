# Gera o executável portátil do cliente para Windows (roda sem instalar, sem permissão de administrador).
# O .exe fica como artefato da execução; numa tag v* (ex.: v1.0.0) também vai para a página Releases.
name: Cliente para Windows (.exe)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'client/**'
      - '.github/workflows/cliente-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Dependências
        run: npm ci --no-audit --no-fund

      - name: Versão da tag (v1.2.3 → 1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Gerar o .exe portátil
        run: npm run exe

      - uses: actions/upload-artifact@v4
        with:
          name: MedicalField-windows
          path: client/release/*.exe
          if-no-files-found: error

      - name: Publicar na página Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/release/*.exe
